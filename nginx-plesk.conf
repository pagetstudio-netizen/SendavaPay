# ============================================================
#  SendavaPay — Configuration Nginx sécurisée pour Plesk
#  À ajouter dans : Plesk → sendavapay.com → Apache & Nginx
#  Section : "Directives supplémentaires Nginx"
# ============================================================

# ── 1. BLOQUER TOUS LES FICHIERS SOURCE ET CONFIG ────────────
# Aucun fichier .ts, .js (racine), .env, .json de config ne doit
# être accessible publiquement depuis Internet.

# Bloquer les extensions dangereuses
location ~* \.(ts|tsx|php|py|sh|env|log|sql|bak|orig|swp|map)$ {
    return 403;
}

# Bloquer les répertoires sources
location ~ ^/(server|shared|client|script|node_modules|sdk/src|\.(git|env|replit|config))/ {
    return 403;
}

# Bloquer les dotfiles (.replit, .env, .git, .gitignore, etc.)
location ~ /\. {
    deny all;
    return 403;
}

# Bloquer les fichiers de configuration à la racine
location ~ ^/(package(-lock)?\.json|drizzle\.config\..+|tsconfig.*\.json|vite\.config\..+|tailwind\.config\..+|postcss\.config\..+|ecosystem\.config\..+|README\.md|replit\.md)$ {
    return 403;
}

# ── 2. SERVIR LE FRONTEND COMPILÉ (dist/public) ─────────────
# Seul le dossier dist/public/ est exposé publiquement.
# Le reste est traité par Node.js sur le port 5000.

root /var/www/vhosts/sendavapay.com/httpdocs/dist/public;

location / {
    try_files $uri $uri/ @nodejs;
}

# Assets statiques compilés — cache agressif
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# SDK public (JS uniquement — pas les sources .ts/.php/.py)
location /sdk/ {
    location ~* \.(ts|php|py)$ { return 403; }
    try_files $uri @nodejs;
}

# ── 3. PROXY VERS NODE.JS (port 5000) ───────────────────────
location @nodejs {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

# Routes API — toujours vers Node.js
location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Webhooks paiement — timeout plus long
location /api/webhook/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# ── 4. HEADERS DE SÉCURITÉ NGINX ────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
more_clear_headers "Server";
add_header Server "sendavapay" always;

# ── 5. RATE LIMITING (anti-DDoS niveau Nginx) ──────────────
# Décommenter si le module limit_req est disponible sur votre Plesk :
# limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
# location /api/ {
#     limit_req zone=api burst=100 nodelay;
#     ... (proxy vers Node.js)
# }
